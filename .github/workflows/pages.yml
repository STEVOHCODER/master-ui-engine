name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every class resolves, every header is parseable
        run: node tools/mue.js check all
      - name: Catalog, headers and sheet stay consistent
        run: node tools/mue.js doctor
      - name: The registry an agent installs from is well-formed
        run: node tools/mue.js registry --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const n=(j.items||[]).length;if(!n)throw new Error('registry has no items');console.log(n+' registry items, '+((j.regions||[]).length)+' regions')})"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: out
        uses: actions/deploy-pages@v4
