<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign up | MASTER-UI-ENGINE</title>
<link rel="stylesheet" href="../../design-tokens/engine.css">
<style>
  :root{
    --shadow-sm:0 1px 3px 0 hsla(215,20%,17%,0.08),0 1px 2px -1px hsla(215,20%,17%,0.08);
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:hsl(var(--color-gray-900));background:hsl(var(--color-gray-50))}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-6)}.card{background:var(--bg-surface);border:1px solid hsl(var(--color-gray-200));border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);width:100%;max-width:420px;padding:var(--space-8) var(--space-6)}
  .brand{text-align:center;margin-bottom:var(--space-8)}
  .brand .mark{font-weight:800;font-size:1.5rem;color:hsl(var(--color-gray-900));letter-spacing:-0.02em}
  .brand p{color:hsl(var(--color-gray-500));font-size:0.9375rem;margin-top:var(--space-2)}
  h1{font-size:1.75rem;font-weight:700;letter-spacing:-0.02em;color:hsl(var(--color-gray-900));margin-bottom:var(--space-3);text-align:center}
  .sub{color:hsl(var(--color-gray-500));text-align:center;margin-bottom:var(--space-8);font-size:0.9375rem}
  .field{margin-bottom:var(--space-5)}
  .field label{display:block;font-size:0.875rem;font-weight:600;color:hsl(var(--color-gray-700));margin-bottom:var(--space-2)}.field input{width:100%;border:1px solid hsl(var(--color-gray-300));background:var(--bg-surface);border-radius:var(--radius-base);padding:0.65rem 0.9rem;font-family:inherit;font-size:0.9375rem;color:hsl(var(--color-gray-900))}
  .field input:focus{border-color:hsl(var(--color-primary-500));box-shadow:0 0 0 3px hsl(var(--color-primary-500) / 0.15)}
  .field input.error{border-color:hsl(var(--color-error-500))}
  .err{color:hsl(var(--color-error-500));font-size:0.8125rem;margin-top:var(--space-2);display:none}
  .field.error .err{display:block}
  .field.error input{border-color:hsl(var(--color-error-500))}
  .field-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6)}
  .terms{font-size:0.8125rem;color:hsl(var(--color-gray-500));line-height:1.5}
  .terms a{color:hsl(var(--color-primary-500));text-decoration:none;font-weight:600}
  button{width:100%;display:flex;align-items:center;justify-content:center;gap:var(--space-2);border:none;border-radius:var(--radius-base);background:hsl(var(--color-primary-500));color:hsl(var(--color-gray-50));font-family:inherit;font-weight:600;font-size:0.9375rem;padding:0.75rem 1rem;cursor:pointer}
  button:hover{background:hsl(var(--color-primary-600))}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .divider{display:flex;align-items:center;gap:var(--space-4);margin:var(--space-6) 0; color:hsl(var(--color-gray-600));font-size:0.875rem}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:hsl(var(--color-gray-200))}
  .social{display:flex;gap:var(--space-3)}.social button{flex:1;background:var(--bg-surface);border:1px solid hsl(var(--color-gray-300));color:hsl(var(--color-gray-700));font-weight:500;padding:0.65rem 1rem}
  .social button:hover{background:hsl(var(--color-gray-100))}
  .footer{text-align:center;margin-top:var(--space-8);color:hsl(var(--color-gray-500));font-size:0.9375rem}
  .footer a{color:hsl(var(--color-primary-500));font-weight:600;text-decoration:none}
  .footer a:hover{text-decoration:underline}
  .success-msg{background:hsl(var(--color-success-500) / 0.12);color:hsl(var(--color-success-500));border:1px solid hsl(var(--color-success-500) / 0.25);border-radius:var(--radius-base);padding:var(--space-4);text-align:center;font-size:0.9375rem}
  .theme-toggle{position:fixed;top:var(--space-4);right:var(--space-4);width:auto;background:hsl(var(--color-gray-200));border:none;border-radius:9999px;padding:0.25rem 0.75rem;font-size:0.875rem;cursor:pointer;color:hsl(var(--color-gray-800));z-index:20}
  .theme-toggle .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--color-primary-500));display:inline-block;margin-left:0.5rem}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><span>Dark mode</span><span class="dot" id="themeDot"></span></button>
<div class="card">
  <div class="brand"><div class="mark">APP</div><p>Create your account</p></div>
  <h1>Create account</h1>
  <p class="sub">Join us. It only takes a minute.</p>
  <div class="success-msg" id="success" style="display:none">Welcome! Your account has been created.</div>
  <div class="field">
    <label for="name">Full name</label>
    <input id="name" type="text" placeholder="Alex Morgan">
  </div>
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="alex@example.com" autocomplete="email">
    <span class="err">Enter a valid email</span>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
    <span class="err">At least 6 characters</span>
  </div>
  <div class="field">
    <label class="checkbox" style="display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer">
      <input type="checkbox" id="terms" style="appearance:none;width:1rem;height:1rem;border:1px solid hsl(var(--color-gray-300));border-radius:0.25rem;background:var(--bg-surface)">
      <span>I agree to the <a href="#" class="terms">Terms of Service</a> and <a href="#" class="terms">Privacy Policy</a></span>
    </label>
  </div>
  <button id="signup">Create account</button>
  <div class="divider"><span>Or continue with</span></div>
  <div class="social"><button>Google</button><button>GitHub</button></div>
  <div class="footer">Already have an account? <a href="login.html">Sign in</a></div>
</div>
<script>
  const btn=document.getElementById('themeToggle');const dot=document.getElementById('themeDot');const html=document.documentElement;
  btn.addEventListener('click',()=>{html.classList.toggle('dark');dot.style.background=html.classList.contains('dark')?'hsl(var(--color-primary-400))':'hsl(var(--color-primary-500))';localStorage.setItem('mui-theme',html.classList.contains('dark')?'dark':'light')});
  const saved=localStorage.getItem('mui-theme');if(saved==='dark'){html.classList.add('dark');dot.style.background='hsl(var(--color-primary-400))'}
  document.getElementById('signup').onclick=function(){const name=document.getElementById('name');const email=document.getElementById('email');const pass=document.getElementById('password');const terms=document.getElementById('terms');let ok=true;[name,email,pass].forEach(f=>{if(!f.value.trim()){f.parentElement.classList.add('error');ok=false}else{f.parentElement.classList.remove('error')}});if(!email.value.includes('@')){email.parentElement.classList.add('error');ok=false}if(pass.value.length<6){pass.parentElement.classList.add('error');ok=false}if(!terms.checked){ok=false}if(ok){document.getElementById('success').style.display='block';document.getElementById('signup').disabled=true;document.getElementById('signup').textContent='Account created'}}
</script>
</body>
</html>
