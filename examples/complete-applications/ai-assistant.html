<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- BEGIN MUE:META

  GROUP: Examples

  RESPONSIVE: reflows at <=768px
  VERIFIED: WCAG AA contrast in light + dark and no overflow at 375/768/1280, audited 2026-10-31

<title>AI Assistant | MASTER-UI-ENGINE</title>
<link rel="stylesheet" href="../../design-tokens/engine.css">
<style>
  :root{
    --shadow-sm:0 1px 3px 0 hsla(215,20%,17%,0.08),0 1px 2px -1px hsla(215,20%,17%,0.08);
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:hsl(var(--color-gray-900));background:hsl(var(--color-gray-50))}
  body{margin:0;overflow:hidden}
  .app{display:flex;height:100vh}.sidebar{width:280px;background:var(--bg-surface);border-right:1px solid hsl(var(--color-gray-200));display:flex;flex-direction:column;z-index:10;flex-shrink:0}
  .sidebar-header{padding:var(--space-6);border-bottom:1px solid hsl(var(--color-gray-100))}
  .sidebar-title{font-weight:800;font-size:1.25rem;color:hsl(var(--color-gray-900));letter-spacing:-0.02em}
  .sidebar-actions{display:flex;gap:var(--space-3);margin-top:var(--space-4)}
  button{display:inline-flex;align-items:center;gap:var(--space-2);border:none;border-radius:var(--radius-base);font-family:inherit;font-weight:500;font-size:0.875rem;padding:0.5rem 0.9rem;cursor:pointer}
  .btn-outline{background:transparent;border:1px solid hsl(var(--color-gray-300));color:hsl(var(--color-gray-700))}
  .btn-outline:hover{background:hsl(var(--color-gray-100))}
  .btn-primary{background:hsl(var(--color-primary-500));color:hsl(var(--color-gray-50))}
  .btn-primary:hover{background:hsl(var(--color-primary-600))}
  .conversations{flex:1;overflow-y:auto;padding:var(--space-4) 0}
  .conversations ul{list-style:none;padding:0;margin:0}
  .conversations li{padding:0.7rem var(--space-6)}
  .conversations a{display:flex;align-items:center;gap:var(--space-3);color:hsl(var(--color-gray-600));text-decoration:none;font-size:0.9375rem;border-radius:var(--radius-base)}
  .conversations a:hover{background:hsl(var(--color-gray-100));color:hsl(var(--color-gray-900))}
  .conversations a.active{background:hsl(var(--color-primary-500) / 0.1);color:hsl(var(--color-primary-600))}
  .main{flex:1;background:hsl(var(--color-gray-50));display:flex;flex-direction:column;min-width:0}.topbar{height:56px;border-bottom:1px solid hsl(var(--color-gray-200));background:var(--bg-surface);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-6);flex-shrink:0}
  .topbar-left{display:flex;align-items:center;gap:var(--space-6)}
  .chat-title{font-weight:600;color:hsl(var(--color-gray-900));font-size:1rem}
  .messages{flex:1;overflow-y:auto;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
  .msg{display:flex;gap:var(--space-3);max-width:76%}
  .msg.ai{align-self:flex-start}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .bubble{padding:var(--space-4) var(--space-6);border-radius:var(--radius-lg);font-size:0.9375rem;line-height:1.6}.msg.ai .bubble{background:var(--bg-surface);border:1px solid hsl(var(--color-gray-200));color:hsl(var(--color-gray-900));border-bottom-left-radius:0.25rem}
  .msg.user .bubble{background:hsl(var(--color-primary-500));color:hsl(var(--color-gray-50));border-bottom-right-radius:0.25rem}
  .avatar{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-size:0.8rem;font-weight:700;flex-shrink:0}
  .msg.ai .avatar{background:hsl(var(--color-gray-100));color:hsl(var(--color-gray-700))}
  .msg.user .avatar{background:hsl(var(--color-primary-500));color:hsl(var(--color-gray-50))}
  .typing{font-size:0.85rem;color:hsl(var(--color-gray-500));font-style:italic}.composer{border-top:1px solid hsl(var(--color-gray-200));background:var(--bg-surface);padding:var(--space-4) var(--space-6);flex-shrink:0}
  .composer-inner{display:flex;gap:var(--space-3);align-items:flex-end}
  textarea{flex:1;border:1px solid hsl(var(--color-gray-200));background:hsl(var(--color-gray-100));border-radius:var(--radius-full);padding:0.7rem 1.2rem;font-family:inherit;font-size:0.9375rem;color:hsl(var(--color-gray-900));resize:none;min-height:2.4rem}
  textarea:focus{border-color:hsl(var(--color-primary-500));box-shadow:0 0 0 3px hsla(var(--color-primary-500)/0.35)}
  .composer button{background:hsl(var(--color-primary-500));color:hsl(var(--color-gray-50));width:2.4rem;height:2.4rem;border-radius:50%;padding:0;display:grid;place-items:center;flex-shrink:0}
  .composer button:hover{background:hsl(var(--color-primary-600))}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:hsl(var(--color-gray-500));text-align:center}
  .empty svg{width:48px;height:48px;margin-bottom:var(--space-4);color:hsl(var(--color-gray-300))}
  @media (max-width:768px){.sidebar{position:fixed;left:-280px;top:0;bottom:0;z-index:50;transition:left 0.3s}.sidebar.open{left:0}}
  .theme-toggle{background:none;border:none;color:hsl(var(--color-gray-600));cursor:pointer;font-size:1.1rem;margin-left:auto}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Conversations">
    <div class="sidebar-header">
      <div class="sidebar-title">Assistant</div>
      <div class="sidebar-actions">
        <button class="btn-primary">New chat</button>
      </div>
    </div>
    <div class="conversations">
      <ul>
        <li><a class="active" href="#"><span>&#128221;</span> Project planning</a></li>
        <li><a href="#"><span>&#128221;</span> Code review</a></li>
        <li><a href="#"><span>&#128221;</span> Design feedback</a></li>
        <li><a href="#"><span>&#128221;</span> Meeting notes</a></li>
      </ul>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-outline" style="padding:0.4rem 0.8rem" id="sidebarToggle" aria-label="Toggle sidebar">&#9776;</button>
        <div class="chat-title">Project planning</div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">&#127762;</button>
    </header>
    <div class="messages" id="messages">
      <div class="msg ai"><div class="avatar">A</div><div class="bubble">Hi! I&rsquo;m your assistant. How can I help you plan your project today?</div></div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Message..."></textarea>
        <button id="send" aria-label="Send">&#9654;</button>
      </div>
    </div>
  </div>
</div>
<script>
  const btn=document.getElementById('themeToggle');const html=document.documentElement;
  btn.addEventListener('click',()=>{html.classList.toggle('dark');localStorage.setItem('mui-theme',html.classList.contains('dark')?'dark':'light')});
  const saved=localStorage.getItem('mui-theme');if(saved==='dark')html.classList.add('dark');
  const input=document.getElementById('input');const send=document.getElementById('send');const messages=document.getElementById('messages');
  function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=cls==='ai'?'<div class="avatar">A</div><div class="bubble">'+text+'</div>':'<div class="bubble">'+text+'</div><div class="avatar">U</div>';messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
  send.onclick=()=>{const v=input.value.trim();if(!v)return;add(v,'user');input.value='';add('That&rsquo;s a great start. Here are the next steps: 1) Define goals, 2) Set milestones, 3) Assign owners, 4) Review weekly. Want a template?','ai')}
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.onclick()}})
  document.getElementById('sidebarToggle').onclick=()=>{document.querySelector('.sidebar').classList.toggle('open')}
</script>
</body>
</html>
