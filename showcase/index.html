<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual lab | MASTER-UI-ENGINE</title>

  THEME: the lab's own dark chrome, plus a light/dark switch that writes mui-theme so the iframed previews follow

<link rel="stylesheet" href="../design-tokens/engine.css">
<link rel="stylesheet" href="lab.css">
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d24;
    --panel-2: #1d242c;
    --line: #2a333d;
    --text: #e8edf2;
    --muted: #cdd5de;
    --accent: #3b82f6;
    --accent-soft: #1e3a5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .logo { font-weight: 700; letter-spacing: -0.03em; font-size: 14px; white-space: nowrap; }
  .logo span { color: var(--muted); font-weight: 500; }
  input[type="search"] {
    flex: 1;
    max-width: 240px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .toolbar button, .toolbar a {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: var(--motion-colors);
  }
  .toolbar button.active, .toolbar button[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  nav {
    overflow: auto;
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 8px 24px;
  }
  .group { margin-bottom: 18px; }
  .group h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 4px 8px 8px;
  }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover { background: var(--panel-2); }
  .item:focus-visible, .toolbar button:focus-visible, .toolbar a:focus-visible,
  .kbd-trigger:focus-visible, .studio-link:focus-visible, .thumb:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .item.active { background: var(--accent-soft); color: #fff; }
  .item small { display: block; color: var(--muted); font-size: 11px; }
  .stage {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: #0b0f13;
  }
  .meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  .meta-bar strong { color: var(--text); }
  .meta-bar .hint kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--panel-2);
  }
  .frame-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 16px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: #0b0f13;
  }
  .frame-wrap.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    align-content: start;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    min-height: 70vh;
  }
  .frame-wrap:not(.gallery) iframe { max-width: var(--preview-w, 100%); }
  .thumb {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    min-height: 250px;
  }
  .thumb header {
    display: block;
    padding: 8px 10px;
    font-size: 12px;
    border: 0;
    border-bottom: 1px solid var(--line);
  }
  /* A thumbnail is a real desktop render scaled into the card, so the layout
     you see is the one the design uses above its breakpoints. */
  .thumb-frame { position: relative; flex: 1; overflow: hidden; background: #fff; }
  .thumb-frame iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: calc(100% / var(--s, 0.25));
    min-height: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    transform: scale(var(--s, 0.25));
    transform-origin: top left;
    pointer-events: none;
  }
  .empty { color: var(--muted); padding: 40px; }
  @media (max-width: 1180px) {
    input[type="search"] { max-width: 170px; }
    .kbd-trigger .trigger-words { display: none; }
  }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    header { flex-wrap: wrap; height: auto; padding: 10px 12px; row-gap: 8px; }
    input[type="search"] { flex: 1 1 100%; max-width: none; order: 3; }
    .toolbar { margin-left: 0; width: 100%; }
    nav { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="logo">MASTER-UI-ENGINE <span>visual lab</span></div>
  <button type="button" id="palette-trigger" class="kbd-trigger" aria-haspopup="dialog"
          aria-expanded="false" aria-controls="palette" title="Search every preview and command">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    <span class="trigger-words">Search previews &amp; commands</span>
    <span data-short>Search</span>
    <kbd>Ctrl K</kbd>
  </button>
  <input type="search" id="search" placeholder="Filter sidebar…" aria-label="Filter the sidebar list">
  <div class="toolbar">
    <button type="button" data-view="lab" class="active" title="One preview in the stage">Stage</button>
    <button type="button" data-view="gallery" title="All previews as thumbnails">Gallery</button>
    <button type="button" data-width="375">375</button>
    <button type="button" data-width="768">768</button>
    <button type="button" data-width="1200">1200</button>
    <button type="button" data-width="100%" class="active">Fluid</button>
    <button type="button" id="theme-btn" aria-pressed="false" title="Preview theme, shared with every preview">Dark</button>
    <a href="studio.html" title="Live token studio">Token studio</a>
    <a id="open-tab" href="#" target="_blank" rel="noopener">Open isolated</a>
  </div>
</header>
<nav id="nav" aria-label="Designs"></nav>
<div class="stage">
  <div class="meta-bar">
    <div id="status">Select a design</div>
    <div class="hint">j / k next · <kbd id="shortcut-hint">Ctrl K</kbd> search</div>
  </div>
  <div class="frame-wrap" id="stage"></div>
</div>
<script src="data/catalog.js"></script>
<script src="lab.js"></script>
</body>
</html>
